name: Affairs

# 낱말퍼즐 매거진 앱이 받는 그날의 시사 용어(affairs/YYYY-MM.json)를 채운다(2026-09-23).
# 원본은 뉴스 브리핑 저장소의 App Terms 결과 — 맥 브리핑이 새벽(보통 KST 04시대)에 그날 파일을 채운다.
# 앱은 오전 8시(KST)에 그날 용어를 연다(그 전에 받아 둬도 8시 전에는 안 보인다).
# GitHub 예약 실행은 한두 시간씩 늦거나 빠지기도 한다(2026-09-24 첫날: 07:48 회차가 09:55에 돎) — 그래서
# KST 04:48부터 07:48까지 30분마다, 그 뒤 12:48까지 매시간 돈다. 날짜 없이 돌리면 오늘과 지난 이틀 중 빈 날도 채운다.
# 이미 그날 다섯 개가 있으면 아무것도 바꾸지 않는다(대부분의 회차는 몇 초 만에 "바뀐 것 없음"으로 끝난다).
# 고르는 규칙은 .github/affairs/publish.py.
on:
  schedule:
    # UTC(전날) 19:48 · 20:18 · 20:48 · 21:18 · 21:48 · 22:18 · 22:48 = KST 04:48~07:48 30분마다
    # UTC 23:48 · 00:48~03:48 = KST 08:48~12:48 매시간
    - cron: '48 19-23,0-3 * * *'
    - cron: '18 20-22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'KST 날짜 YYYY-MM-DD — 비우면 오늘과 지난 이틀 중 빈 날'
        required: false

permissions:
  contents: write
  pages: write          # 사이트가 저장소보다 늦으면 배포를 다시 요청한다(맨 끝 단계)

concurrency:
  group: affairs
  cancel-in-progress: false

jobs:
  publish:
    # ubuntu-latest 는 2026-10-19부터 Ubuntu 26 으로 바뀐다 — 새 이미지에 Python 3.11 이 늦게 들어오면 setup-python 이 깨지므로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish today's terms
        env:
          INPUT_DATE: ${{ inputs.date }}
        # pipefail — 스크립트가 죽으면 tee 뒤에 숨지 않고 이 단계가 실패로 끝난다(실패하면 GitHub 가 메일로 알린다)
        run: |
          set -o pipefail
          if [ -n "$INPUT_DATE" ]; then python .github/affairs/publish.py --date "$INPUT_DATE"; else python .github/affairs/publish.py; fi | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check files the app reads
        # 앱이 읽는 모양(version·month·날짜·표제·뜻풀이)이 맞는지 — 어긋나면 올리지 않고 실패로 끝낸다
        run: python .github/affairs/publish.py --check

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain affairs/)" ]; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affairs/
          git commit -m "시사 용어 $(TZ=Asia/Seoul date +%F)"
          # 그사이 다른 커밋이 올라왔으면 위에 얹어 다시 민다(세 번까지)
          for try in 1 2 3; do git push && exit 0; git pull --rebase origin main; done
          exit 1

      - name: Redeploy site if it missed terms
        # 저장소엔 용어가 있는데 사이트엔 없을 때 — GitHub 쪽 장애로 Pages 배포가 취소되면 다음 커밋까지 아무도 다시 배포하지 않는다
        # (2026-10-06: 러너를 못 받아 맥이 올린 그날 용어가 사이트에 안 올라감). 마지막 배포 요청이 20분 넘게 지났는데도
        # 사이트의 이번 달 파일 마지막 날짜가 저장소와 다르면 배포를 다시 요청한다. 방금 이 실행이 민 커밋은 그 배포를 기다린다.
        # ponytail: 이번 달 파일만 본다 — 달이 바뀐 첫날 지난달 보충분만 빠진 경우는 못 잡는다(다음 커밋 배포에 실린다)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(TZ=Asia/Seoul date +%Y-%m)
          file="affairs/$month.json"
          [ -f "$file" ] || { echo "$file 없음 — 건너뜀"; exit 0; }
          last() { python3 -c "import json,sys; print(max(json.load(sys.stdin)['days']))"; }
          repo=$(last < "$file")
          live=$(curl -fsS "https://allenst486de.github.io/natmalpuzzle/$file?t=$(date +%s)" | last) || live="없음"
          echo "저장소 $repo · 사이트 $live"
          [ "$repo" = "$live" ] && exit 0
          built=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" -q .created_at)
          age=$(( $(date +%s) - $(date -d "$built" +%s) ))
          if [ "$age" -lt 1200 ]; then echo "마지막 배포 요청 ${age}초 전 — 기다림"; exit 0; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" -q '"배포 다시 요청: " + .status' | tee -a "$GITHUB_STEP_SUMMARY"
